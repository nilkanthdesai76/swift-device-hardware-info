name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version
      - name: Build Package
        run: swift build -v
      - name: Run Test Suite
        run: swift test -v
      - name: Verify Documentation & Assets
        run: |
          test -f README.md
          test -f LICENSE
          test -f assets/device_hardware_architecture.svg
          echo "Telemetry package build and tests validated."
