<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4,6" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="280" y1="0" x2="280" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="920" y1="0" x2="920" y2="480"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
    <text x="65" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">SWIFT 6 READY</text>
    <text x="145" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">DeviceHardwareInfo Architecture</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13">High-precision Darwin Mach kernel telemetry &amp; hardware monitoring for Apple platforms</text>
  </g>

  <!-- Top Layer: App / Developer Facade -->
  <g transform="translate(60, 120)">
    <rect width="880" height="60" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="36" cy="30" r="10" fill="#3b82f6" fill-opacity="0.2"/>
    <circle cx="36" cy="30" r="4" fill="#60a5fa"/>
    <text x="60" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700">DeviceHardware Facade (API Layer)</text>
    <text x="60" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11">DeviceHardware.memory  •  .cpu  •  .storage  •  .device  •  .battery  •  .fullReport()</text>
    <rect x="740" y="16" width="120" height="28" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#60a5fa" stroke-width="1"/>
    <text x="800" y="34" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Zero Overhead</text>
  </g>

  <!-- Middle Subsystems Grid -->
  <!-- 1. Memory Reader -->
  <g transform="translate(60, 205)">
    <rect width="164" height="135" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700" text-anchor="middle">RAM</text>
    <text x="52" y="33" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">MemoryReader</text>
    <text x="12" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Total Physical RAM</text>
    <text x="12" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Active / Wired / Free</text>
    <text x="12" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Compressed Pages</text>
    <text x="12" y="120" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">phys_footprint</text>
  </g>

  <!-- 2. CPU Reader -->
  <g transform="translate(239, 205)">
    <rect width="164" height="135" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU</text>
    <text x="52" y="33" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">CPUReader</text>
    <text x="12" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Logical / Active Cores</text>
    <text x="12" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Per-core Load %</text>
    <text x="12" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• User / System Ticks</text>
    <text x="12" y="120" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">Apple Silicon Brand</text>
  </g>

  <!-- 3. Storage Reader -->
  <g transform="translate(418, 205)">
    <rect width="164" height="135" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SSD</text>
    <text x="52" y="33" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">StorageReader</text>
    <text x="12" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Volume Capacity</text>
    <text x="12" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Available Storage</text>
    <text x="12" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Purgeable Caches</text>
    <text x="12" y="120" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">POSIX statvfs</text>
  </g>

  <!-- 4. Device Model Reader -->
  <g transform="translate(597, 205)">
    <rect width="164" height="135" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700" text-anchor="middle">DEV</text>
    <text x="52" y="33" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">DeviceModel</text>
    <text x="12" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• hw.machine / hw.model</text>
    <text x="12" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Marketing Resolver</text>
    <text x="12" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• OS Version &amp; Arch</text>
    <text x="12" y="120" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">Formatted Uptime</text>
  </g>

  <!-- 5. Battery Reader -->
  <g transform="translate(776, 205)">
    <rect width="164" height="135" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#ec4899" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700" text-anchor="middle">BAT</text>
    <text x="52" y="33" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">BatteryReader</text>
    <text x="12" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Charge Level (0-100%)</text>
    <text x="12" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Charging / Unplugged</text>
    <text x="12" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5">• Low Power Mode</text>
    <text x="12" y="120" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">Thermal State</text>
  </g>

  <!-- Bottom Kernel / Hardware Layer -->
  <g transform="translate(60, 365)">
    <rect width="880" height="64" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="440" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">DARWIN &amp; MACH KERNEL SUBSYSTEM (LOW LEVEL C / POSIX)</text>
    <text x="440" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" text-anchor="middle">vm_statistics64  |  host_processor_info  |  task_info(TASK_VM_INFO)  |  sysctlbyname  |  statvfs  |  IOPSCopyPowerSourcesInfo</text>
  </g>

  <!-- Connecting Lines -->
  <g stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.4">
    <line x1="142" y1="180" x2="142" y2="205"/>
    <line x1="321" y1="180" x2="321" y2="205"/>
    <line x1="500" y1="180" x2="500" y2="205"/>
    <line x1="679" y1="180" x2="679" y2="205"/>
    <line x1="858" y1="180" x2="858" y2="205"/>

    <line x1="142" y1="340" x2="142" y2="365"/>
    <line x1="321" y1="340" x2="321" y2="365"/>
    <line x1="500" y1="340" x2="500" y2="365"/>
    <line x1="679" y1="340" x2="679" y2="365"/>
    <line x1="858" y1="340" x2="858" y2="365"/>
  </g>
</svg>
